function render(){const ended=!s.alive;$('headline').innerHTML=`<h2>${ended?'☠️ 군락 멸망':'🌿 생존 '+s.day+'일차'}</h2>${sceneThumb(s.message)}<div class="notice">${esc(s.message)}</div><p class="small muted">${ended?'새로운 군락으로 다시 시작할 수 있습니다.':`남은 명령 ${s.actions}/2 · 다음 날에는 식량이 소비되고, 적 군락도 움직입니다.`}</p><div class="bar"><i style="width:${s.queen}%"></i></div><div class="small">여왕 체력 ${s.queen}/100 · 습격 위험 ${s.threat}/100</div>`;

renderExplore();renderRelics();const recent=s.logs.slice(0,5).map(x=>{const cls=/실종|돌아오지|전사|침공|습격|굶주림|멸망|부상|부족/.test(x)?'critical':/유물|귀환|성공|부화|발견/.test(x)?'reward':'';return `<p class="${cls}">${esc(x)}</p>`}).join('');$('recentHome').innerHTML=recent;$('recentExplore').innerHTML=recent;$('historyList').innerHTML=s.logs.map(x=>`<p>${esc(x)}</p>`).join('')}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function dailyEat(){return Math.max(2,Math.ceil((s.workers+s.soldiers+(s.away?s.away.w+s.away.b:0)+1)/3))+(active('eggs')?3:0)+(active('root')?2:0)}function order(type){if(!s.alive||s.actions<1)return;if(type==='forage'){if(!s.workers)return;let gain=rnd(3,7)+Math.min(9,s.workers);if(active('amber'))gain=Math.ceil(gain*1.5);s.food+=gain;log('일개미들이 주변에서 식량 '+gain+'개를 채집했습니다.')}if(type==='lay'){let cost=7+(active('amber')?3:0);if(s.food<cost)return;s.food-=cost;let n=rnd(1,2)+(active('eggs')?rnd(1,2):0);s.eggs+=n;log('여왕이 알 '+n+'개를 낳았습니다. 내일 부화합니다.')}if(type==='fortify'){if(s.wood<5)return;s.wood-=5;s.guard++;log('일개미들이 둥지를 보강했습니다. 방어 시설 '+s.guard+'단계.')}if(type==='train'){if(s.food<9||!s.workers)return;s.food-=9;s.workers--;s.soldiers++;log('일개미 한 마리가 병정개미로 전환되었습니다.')}s.actions--;update()}
function renderExplore(){let html='';if(s.pending){html=`${sceneThumb(s.pending.text)}<div class="notice">${esc(s.pending.text)}</div><div class="options">${s.pending.options.map((o,i)=>`<button onclick="resolveEvent(${i})">${esc(o.label)}<small>${esc(o.hint)}</small></button>`).join('')}</div>`}else if(s.away){html=`${sceneThumb("탐사대가 미지의 통로로 향했습니다.")}<div class="notice">탐사대가 아직 돌아오지 않았습니다.\n일개미 ${s.away.w}마리 · 병정개미 ${s.away.b}마리\n남은 기간 ${s.away.days}일</div><p class="small muted">귀환할 때까지 파견 개미는 군락에서 사용할 수 없습니다. 다음 날로 진행하세요.</p>`}else if(!s.alive){html='<p>군락의 탐사는 끝났습니다.</p>'}else{html=`${s.exploreArt?sceneThumb(s.message):sceneThumb("탐사대가 통로를 탐색합니다.")}<p class="small muted">탐사대는 하루 이상 돌아오지 않을 수 있습니다. 일개미는 자원을 운반하고 병정개미는 위험을 막습니다. 탐사에는 명령 1회가 필요합니다.</p><div class="row"><label>일개미</label><input type="number" id="ew" min="0" max="${s.workers}" value="${Math.min(2,s.workers)}"></div><div class="row"><label>병정개미</label><input type="number" id="eb" min="0" max="${s.soldiers}" value="${Math.min(1,s.soldiers)}"></div><div class="row"><label>탐사 거리</label><select id="dist"><option value="1">가까운 곳 · 안전 / 작은 보상</option><option value="2">먼 곳 · 위험 / 큰 보상</option><option value="3">미지의 심층 · 매우 위험 / 유물 기회</option></select></div>${btn('🧭 탐사대 파견', 'sendExpedition()',!s.actions||s.workers+s.soldiers===0,'primary')}`}
if(s.missing.length){html+='<h3>❓ 실종된 탐사대</h3>'+s.missing.map((m,i)=>`<div class="notice">${m.day}일차 실종 · 일개미 ${m.w}, 병정개미 ${m.b} · ${m.days}일 경과</div>${btn('구조대 파견 · 병정 2명 / 명령 1회',`rescue(${i})`,!s.alive||!s.actions||s.soldiers<2)}`).join('')} $('expedition').innerHTML=html}
function sendExpedition(){if(!s.alive||s.actions<1||s.away||s.pending)return;const w=Number($('ew').value),b=Number($('eb').value),dist=Number($('dist').value);if(!Number.isInteger(w)||!Number.isInteger(b)||w<0||b<0||w>s.workers||b>s.soldiers||w+b<1||![1,2,3].includes(dist))return alert('파견 인원을 확인해 주세요.');s.workers-=w;s.soldiers-=b;s.away={w,b,dist,days:dist===1?1:rnd(1,dist),origin:s.day};s.actions--;log(`탐사대 ${w+b}마리가 ${['','가까운 통로','먼 숲','미지의 심층'][dist]}로 떠났습니다. 무사히 돌아오기를 바랍니다.`);update()}
function expeditionReturn(){const a=s.away;if(!a)return;const artPrefix=['','near','far','unknown'][a.dist];s.away=null;const protection=clamp(a.b/(a.w+a.b+1)*.32,0,.23)+(active('eye')?.16:0);const risk=clamp(.09+a.dist*.13-protection+(active('bell')?.08:0),.02,.72);const roll=Math.random();if(roll<risk*.24){s.missing.push({w:a.w,b:a.b,day:s.day,days:0});s.lost+=a.w+a.b;log(`❓ 탐사대 ${a.w+a.b}마리가 귀환하지 않았습니다. 생사조차 알 수 없습니다.`);s.exploreArt=artPrefix+'_fail';return}if(roll<risk){const lw=Math.min(a.w,rnd(0,Math.max(1,Math.ceil(a.w*.6)))),lb=Math.min(a.b,rnd(0,Math.max(1,Math.ceil(a.b*.5))));a.w-=lw;a.b-=lb;s.lost+=lw+lb;s.workers+=a.w;s.soldiers+=a.b;log(`🩸 탐사대가 습격당했습니다. 일개미 ${lw}, 병정개미 ${lb}마리가 돌아오지 못했습니다.`);s.exploreArt=artPrefix+'_fail';return}const r=Math.random();const artSuccess=r>=.30;s.workers+=a.w;s.soldiers+=a.b;s.expeditions++;if(r<.18){log('탐사대가 빈손으로 귀환했습니다. 위험을 피한 것만으로도 다행입니다.')}else if(r<.30){const rival=pick(s.rivals);rival.hostile=clamp(rival.hostile+rnd(5,12),0,100);log(`탐사대가 ${rival.name}의 경계병을 발견했습니다. 상대 군락이 우리 존재를 알아챘습니다.`)}else{let food=rnd(2,7)*a.dist+Math.max(0,a.w-1);if(active('eye'))food=Math.floor(food*.7);let wood=rnd(0,3)*a.dist+(active('wing')?4:0);s.food+=food;s.wood+=wood;log(`탐사대가 무사히 돌아왔습니다. 식량 +${food}, 자재 +${wood}.`)}if(a.dist>=2&&chance(.05+a.dist*.045)){const candidates=RELICS.filter(x=>!s.owned.includes(x.id));if(candidates.length){const found=pick(candidates);s.owned.push(found.id);log('✨ 유물 발견! '+found.name+' — 유물실에서 장착할 수 있습니다.')}}s.exploreArt=artPrefix+(artSuccess?'_success':'_fail');}
function rescue(i){if(!s.alive||s.actions<1||s.soldiers<2||!s.missing[i])return;const m=s.missing.splice(i,1)[0];s.actions--;let success=clamp(.30+s.guard*.035+(active('root')?.25:0)+(active('heart')?.15:0),0,.85);if(chance(success)){s.workers+=m.w;s.soldiers+=m.b;log(`🕯️ 구조 성공! 실종된 일개미 ${m.w}마리와 병정개미 ${m.b}마리가 돌아왔습니다.`)}else{let loss=chance(.4)?1:0;s.soldiers-=loss;log('구조대가 흔적을 찾지 못했습니다.'+(loss?' 구조 중 병정개미 한 마리를 잃었습니다.':''))}update()}
function nextDay(){if(!s.alive)return;s.day++;s.actions=2;const eat=dailyEat();s.food-=eat;if(s.food<0){const deficit=-s.food;s.food=0;s.queen-=clamp(deficit*4,5,22);if(s.workers+s.soldiers>0&&chance(.35)){if(s.workers>0)s.workers--;else s.soldiers--;log('굶주림으로 개미 한 마리가 죽었습니다.')}log(`🥀 식량이 부족합니다! 여왕 체력 감소. 필요 식량 ${eat}개.`)}else log(`새벽이 밝았습니다. 식량 ${eat}개를 소비했습니다.`);if(s.eggs){const n=s.eggs;s.eggs=0;const w=rnd(0,n);s.workers+=w;s.soldiers+=n-w;log(`🥚 알 ${n}개가 부화했습니다. 일개미 +${w}, 병정개미 +${n-w}.`)}if(active('seed'))s.food+=4;if(active('heart'))s.queen-=2;if(active('moss'))s.queen+=3;if(active('stone'))s.wood=Math.max(0,s.wood-1);s.threat+=rnd(1,5)+(active('seed')?4:0)+(active('jaw')?6:0);for(const r of s.rivals){r.strength=clamp(r.strength+rnd(-2,3),3,90);r.hostile=clamp(r.hostile+rnd(-3,3),0,100)}for(const m of s.missing)m.days++;if(s.away){s.away.days--;if(s.away.days<=0)expeditionReturn()}if(s.missing.length&&chance(active('heart')?.19:.045)){const m=s.missing.shift();const w=Math.max(0,m.w-rnd(0,Math.min(2,m.w)));s.workers+=w;s.soldiers+=m.b;log(`🌘 기적적인 귀환! 실종됐던 일개미 ${w}마리, 병정개미 ${m.b}마리가 돌아왔습니다.`)}const attacker=s.rivals.filter(r=>r.hostile>40).sort((a,b)=>b.hostile-a.hostile)[0];if(attacker&&chance(clamp((s.threat/100)*.32+(attacker.hostile/100)*.12,.01,.52))){raid(attacker)}else if(active('bell')&&s.threat>60)log('🔔 묻힌 종이 울립니다. 적 군락의 움직임이 가까워졌습니다.');if(s.day%10===0)log(`🏁 ${s.day}일 생존! 최대 군락 규모 ${s.peak}마리, 방어 성공 ${s.raids}회.`);update()}
function raid(enemy){const defense=s.soldiers*(active('jaw')?1.5:1)*(active('moss')?.8:1)+s.guard*(active('stone')?3.4:2.5);const force=rnd(Math.max(2,enemy.strength-5),enemy.strength+5);if(defense>=force||chance(clamp(defense/(force*2.2),0,.7))){let dead=Math.min(s.soldiers,rnd(0,Math.max(1,Math.ceil(force/7))));if(active('shell'))dead=Math.floor(dead*.5);s.soldiers-=dead;s.raids++;s.threat=Math.max(5,s.threat-28);if(active('jaw'))s.food+=rnd(3,8);log(`⚔️ ${enemy.name}의 침공을 막아냈습니다! 병정개미 ${dead}마리 전사.`)}else{let dead=Math.min(s.soldiers,rnd(1,Math.max(2,Math.ceil(force/3))));if(active('shell'))dead=Math.floor(dead*.65);s.soldiers-=dead;const stolen=Math.min(s.food,rnd(3,12));s.food-=stolen;s.queen-=rnd(5,16);s.threat=Math.max(10,s.threat-15);log(`🔥 ${enemy.name}이(가) 둥지를 습격했습니다! 병정 ${dead}마리 전사, 식량 ${stolen}개 약탈. 여왕이 부상당했습니다.`)}}
function renderRelics(){$('relics').innerHTML=`<p class="small muted">발견한 유물은 최대 3개까지 장착할 수 있습니다. 유물은 강력하지만 반드시 대가가 따릅니다.</p><div class="notice">장착 중 ${s.equipped.length}/3 · ${s.equipped.map(id=>relic(id).name).join(' / ')||'없음'}</div>`+(s.owned.length?s.owned.map(id=>{const r=relic(id);return `<div class="card"><h3>${r.name} ${active(id)?'<span class="tag">장착</span>':''}</h3><div class="good small">효과: ${r.effect}</div><div class="warn small">대가: ${r.curse}</div><div style="margin-top:8px">${btn(active(id)?'장착 해제':'장착하기',`equip('${id}')`,!s.alive||(!active(id)&&s.equipped.length>=3))}</div></div>`}).join(''):'<p class="muted">아직 발견한 유물이 없습니다. 먼 곳과 미지의 심층을 탐사하면 발견할 수 있습니다.</p>')}
function equip(id){if(!s.alive||!s.owned.includes(id))return;const was=active(id);if(was)s.equipped=s.equipped.filter(x=>x!==id);else if(s.equipped.length<3)s.equipped.push(id);log((was?'해제: ':'장착: ')+relic(id).name);update()}
function resetGame(){if(!confirm('현재 군락의 저장 기록을 지우고 처음부터 다시 시작할까요?'))return;s=fresh();update();tab('home')}
const SURVIVAL_GUIDE_KEY='queens_nest_survival_guide_v1';const SURVIVAL_GUIDE_STEPS=[["👑 🐜","여왕의 첫날","여왕개미가 되어 작은 군락을 지휘하고 오래 살아남으세요. 여왕 체력이 0이 되거나 군락에 남은 개미·알·파견대·실종대가 모두 사라지면 멸망합니다.","여왕은 직접 싸우지 않습니다. 생존 일수를 늘리는 것이 목표입니다."],["🌾 🥚","하루 2회 명령","하루에는 명령을 최대 2회 사용할 수 있습니다. 채집은 일개미가 필요하고, 산란은 식량 7개로 알 1~2개를 낳습니다. 둥지 보강은 자재 5개, 병정 육성은 식량 9개와 일개미 1마리가 필요합니다.","유물 효과로 산란 비용·알 개수가 달라질 수 있습니다. 부화한 알은 일개미 또는 병정개미가 됩니다."],["🌙 ⏳","하루 마무리","「하루 마무리 · 다음 날」을 누르면 식량이 소비되고 알이 부화하며, 탐사대 귀환·적 군락 성장·침공 등이 처리됩니다. 명령을 다 쓰지 않아도 다음 날로 넘어갈 수 있습니다.","예상 식량 소비량은 군락 화면의 「오늘의 상황」에서 확인하세요."],["🧭 🌲","탐사대 파견","탐사 탭에서 일개미·병정개미 수와 거리(가까운 통로·먼 숲·미지의 심층)를 선택하세요. 파견에는 명령 1회가 들고, 한 번에 탐사대 하나만 보낼 수 있습니다. 먼 곳일수록 위험이 커집니다.","유물 발견 기회는 먼 숲과 미지의 심층 탐사에만 있습니다. 파견 개미는 귀환 전까지 사용하지 못합니다."],["❓ ⚔️","실종과 침공","탐사대가 실종되면 병정개미 2마리 이상과 명령 1회가 있어야 구조를 시도할 수 있습니다. 병정 2마리가 자동 소모되지는 않지만 구조 실패 시 병정 1마리를 잃을 수 있습니다. 적 군락의 침공에는 병정과 방어 시설이 중요합니다.","탐사대의 구조는 확률로 성공하며, 침공에서 병력·식량·여왕 체력을 잃을 수 있습니다."],["🏺 ✨","유물과 부작용","먼 숲과 미지의 심층에서 운이 좋으면 유물을 발견합니다. 유물실에서 최대 3개까지 장착할 수 있습니다. 각 유물의 효과와 대가를 확인하고 생존 상황에 맞게 조합하세요.","유물은 자동 장착되지 않습니다. 발견 후 유물실에서 직접 장착하세요."],["🏠 🧭","첫 생존 순서","① 군락에서 채집으로 식량 확보 → ② 산란 또는 병정 육성 → ③ 탐사 탭에서 파견 → ④ 하루 마무리 → ⑤ 탐사 귀환·실종·침공 확인 → ⑥ 유물 발견 시 유물실에서 장착","첫날부터 무리한 원정은 위험합니다. 상단 「생존 가이드」로 언제든 다시 볼 수 있습니다."]];let survivalGuideStep=0;function openSurvivalGuide(){survivalGuideStep=0;renderSurvivalGuide();document.getElementById('survivalGuide').hidden=false}function closeSurvivalGuide(){document.getElementById('survivalGuide').hidden=true;try{localStorage.setItem(SURVIVAL_GUIDE_KEY,'yes')}catch(e){}}function moveSurvivalGuide(n){if(survivalGuideStep+n>=SURVIVAL_GUIDE_STEPS.length){closeSurvivalGuide();return}survivalGuideStep=Math.max(0,survivalGuideStep+n);renderSurvivalGuide()}function renderSurvivalGuide(){const g=SURVIVAL_GUIDE_STEPS[survivalGuideStep];document.getElementById('guideMeter').innerHTML=SURVIVAL_GUIDE_STEPS.map((_,i)=>'<i class="'+(i<=survivalGuideStep?'on':'')+'"></i>').join('');document.getElementById('guideArt').textContent=g[0];document.getElementById('guideTitle').textContent=(survivalGuideStep+1)+'/7 · '+g[1];document.getElementById('guideBody').textContent=g[2];document.getElementById('guideTip').textContent='💡 '+g[3];document.getElementById('guideBack').disabled=survivalGuideStep===0;document.getElementById('guideForward').textContent=survivalGuideStep===6?'게임 시작 →':'다음 →'}
update();try{if(!localStorage.getItem(SURVIVAL_GUIDE_KEY))openSurvivalGuide()}catch(e){openSurvivalGuide()}</script></body></html>
