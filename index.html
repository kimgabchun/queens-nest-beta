function sendHealingExpedition(){
  if(!s.alive || s.actions<1 || s.away || s.healAway){
    alert('지금은 치료 원정대를 보낼 수 없습니다.');
    return;
  }

  if(s.soldiers<2){
    alert('⚠️ 치료 원정에는 병정개미 2마리가 필요합니다.');
    return;
  }

  if(!confirm('🌿 여왕 치료 원정대를 파견할까요?\n\n병정개미 2마리 / 명령 1회\n성공 확률 60%\n실패하면 원정대 전멸')){
    return;
  }

  s.soldiers-=2;
  s.actions--;
  s.healAway={b:2,days:rnd(1,2)};

  log('🌿 병정개미 2마리가 여왕을 위한 약초를 찾아 떠났습니다.');
  update();
}

function healingExpeditionReturn(){
  const a=s.healAway;
  if(!a)return;

  s.healAway=null;

  if(chance(.60)){
    s.soldiers+=a.b;
    s.herbs=(s.herbs||0)+1;
    log('🌿 치료 원정 성공! 병정개미들이 약초 1개를 찾아 무사히 돌아왔습니다.');
    s.healArt='success';
  }else{
    s.lost+=a.b;
    log('💀 치료 원정 실패! 약초를 찾던 병정개미 2마리가 전멸했습니다.');
    s.healArt='fail';
  }
}

function healQueen(){
  if(!s.alive)return;

  if((s.herbs||0)<1){
    alert('🌿 치료에 필요한 약초가 없습니다.');
    return;
  }

  if(s.queen>=100){
    alert('👑 여왕의 체력이 이미 가득합니다.');
    return;
  }

  s.herbs--;
  const before=s.queen;
  s.queen=Math.min(100,s.queen+30);

  log('💚 여왕 치료 완료! 체력 +'+(s.queen-before)+'.');
  s.healArt='healed';
  update();
}

function sendExpedition(){if(!s.alive||s.actions<1||s.away||s.pending)return;const w=Number($('ew').value),b=Number($('eb').value),dist=Number($('dist').value);if(!Number.isInteger(w)||!Number.isInteger(b)||w<0||b<0||w>s.workers||b>s.soldiers||w+b<1||![1,2,3].includes(dist))return alert('파견 인원을 확인해 주세요.');s.workers-=w;s.soldiers-=b;s.away={w,b,dist,days:dist===1?1:rnd(1,dist),origin:s.day};s.actions--;log(`탐사대 ${w+b}마리가 ${['','가까운 통로','먼 숲','미지의 심층'][dist]}로 떠났습니다. 무사히 돌아오기를 바랍니다.`);update()}

}
function raid(enemy){
const defense=s.soldiers*(active('jaw')?1.5:1)*(active('moss')?.8:1)
 +fortPower()*(active('stone')?1.35:1);
const force=rnd(Math.max(2,enemy.strength-5),enemy.strength+5);
const victory=defense>=force||chance(clamp(defense/(force*2.2),0,.7));

if(victory){
 let base=rnd(0,Math.max(1,Math.ceil(force/7)));
 if(active('shell'))base=Math.floor(base*.5);
 const dead=Math.min(s.soldiers,fortProtect(base));
 s.soldiers-=dead;
 s.raids++;
 s.threat=Math.max(5,s.threat-28);
 if(active('jaw'))s.food+=rnd(3,8);
 log(`⚔️ ${enemy.name}의 침공을 막아냈습니다! 병정개미 ${dead}마리 전사.`);
}else{
 let base=rnd(1,Math.max(2,Math.ceil(force/3)));
 if(active('shell'))base=Math.floor(base*.65);
 const dead=Math.min(s.soldiers,fortProtect(base));
 s.soldiers-=dead;
 const stolen=Math.min(s.food,fortProtect(rnd(3,12)));
 s.food-=stolen;
 const injury=fortProtect(rnd(5,16));
 s.queen-=injury;
 s.threat=Math.max(10,s.threat-15);
 log(`🔥 ${enemy.name}이(가) 둥지를 습격했습니다! 병정 ${dead}마리 전사, 식량 ${stolen}개 약탈, 여왕 체력 -${injury}.`);
}
}

    queen:s.queen,
    wins:s.raids
  };

  originalRaid(enemy);

  if(!enemy.name.includes('붉은턱'))return;

  const victory=s.raids>before.wins;
  const soldiersLost=Math.max(0,before.soldiers-s.soldiers);
  const workersLost=Math.max(0,before.workers-s.workers);
  const foodLost=Math.max(0,before.food-s.food);
  const queenLost=Math.max(0,before.queen-s.queen);

  let report='🚨 위험!\n\n붉은턱개미들이 습격했습니다!\n\n';

  if(victory){
    report+='🛡️ 방어 성공!\n\n';
  }else{
    report+='🔥 방어 실패!\n\n';
  }

  if(!soldiersLost&&!workersLost&&!foodLost&&!queenLost){
    report+='군락이 손실 없이 습격을 막아냈습니다.';
  }else{
    report+='📋 피해 보고\n';
    if(soldiersLost)report+='⚔️ 병정개미 -'+soldiersLost+'마리\n';
    if(workersLost)report+='🐜 일개미 -'+workersLost+'마리\n';
    if(foodLost)report+='🌾 식량 -'+foodLost+'개\n';
    if(queenLost)report+='👑 여왕 체력 -'+queenLost+'\n';
  }

  report+='\n현재 병정개미: '+s.soldiers+'마리';
  s.raidReport=report;
};

const QN_ACTION_FIELDS=[
  ['food','🌾 식량'],
  ['wood','🪵 자재'],
  ['workers','🐜 일개미'],
  ['soldiers','⚔️ 병정개미'],
  ['eggs','🥚 알'],
  ['herbs','🌿 약초'],
  ['queen','👑 여왕 체력'],
  ['guard','🛡️ 방어 단계'],
  ['actions','📜 남은 명령']
];

function qnSnapshot(){
  const data={};
  for(const [key] of QN_ACTION_FIELDS){
    data[key]=Number(s[key]||0);
  }
  data.equipped=[...(s.equipped||[])];
  data.away=JSON.stringify(s.away||null);
  data.healAway=JSON.stringify(s.healAway||null);
  data.missing=JSON.stringify(s.missing||[]);
  data.message=s.message;
  return data;
}

function qnChanges(before,after){
  const lines=[];

  for(const [key,label] of QN_ACTION_FIELDS){
    const diff=after[key]-before[key];
    if(diff){
      lines.push(label+' '+(diff>0?'+':'')+diff);
    }
  }

  for(const id of after.equipped){
    if(!before.equipped.includes(id)){
      lines.push('✨ 유물 장착: '+relic(id).name);
    }
  }

  for(const id of before.equipped){
    if(!after.equipped.includes(id)){
      lines.push('🎒 유물 해제: '+relic(id).name);
    }
  }

  if(before.away!==after.away){
    lines.push('🧭 탐사대 파견 상태 변경');
  }

  if(before.healAway!==after.healAway){
    lines.push('🌿 치료 원정대 파견 상태 변경');
  }

  if(before.missing!==after.missing){
    lines.push('🕯️ 실종·구조 상태 변경');
  }

  return lines;
}

function qnWrapAction(name,title){
  const originalAction=window[name];

  if(typeof originalAction!=='function'){
    throw new Error('행동 함수 확인 실패: '+name);
  }

  window[name]=function(...args){
    const before=qnSnapshot();

    const result=originalAction.apply(this,args);

    const after=qnSnapshot();
    const changes=qnChanges(before,after);

    if(changes.length){
      const description=before.message!==after.message
        ? String(s.message||'')
        : '';

      qnShowPopup(title,changes,description);
    }

    return result;
  };
}

const QN_RPG_STATS={
 warrior:{hp:150,atk:18,def:15,agi:6},
 ranger:{hp:105,atk:16,def:7,agi:15},

/* QN_LEVEL_SYSTEM_V2 */
const QN_GROWTH_SPECIAL={
 warrior:"def",
 ranger:"agi",
 assassin:"crit",
 mage:"atk"
};

const QN_GROWTH_BASE={
 atk:10,def:10,agi:10,crit:10
};

function qnHeroNormalize(h){
 if(!h)return;

 const lv=Math.max(1,Math.min(50,Math.floor(Number(h.level)||1)));
 h.level=lv;

 if(!h.stats)h.stats={};

 const special=QN_GROWTH_SPECIAL[h.classId]||"atk";

 // 최초 1회만 기존 데이터를 새로운 성장 규칙으로 변환
 if(h.qnGrowthVersion!==2){
  const oldMax=Math.max(1,Number(h.maxHp)||100);
  const oldHp=Math.max(0,Number(h.hp) || 0);
  const hpRatio=Math.min(1,oldHp/oldMax);

  h.qnGrowthBase={
   stats:{...QN_GROWTH_BASE},
   maxHp:100
  };

  h.qnGrowthVersion=2;

  // 방어력 10당이 아닌 방어력 1당 HP +10
  const def=10+(lv-1)*(special==="def"?3:1);
  h.maxHp=100+def*10;
  h.hp=Math.round(h.maxHp*hpRatio);
 }

 for(const key of ["atk","def","agi","crit"]){
  h.stats[key]=QN_GROWTH_BASE[key]+
   (lv-1)*(key===special?3:1);
 }

 const previousMax=Math.max(1,Number(h.maxHp)||100);
 const nextMax=100+qnHeroTotalStat(h,"def")*10;
 h.hp=Math.max(0,(Number(h.hp)||0)+nextMax-previousMax);
 h.maxHp=nextMax;
 h.hp=Math.max(0,Math.min(h.maxHp,Number(h.hp)||0));

 delete h.stats.dodge;
}

function qnHeroCritical(h){
 qnHeroNormalize(h);
 const stat=qnHeroTotalStat(h,"crit");
 const nominal=Math.max(0,stat/10);
 const limitBreak=qnHasLegendaryEffect(h,"limitBreak");
 const chance=Math.min(limitBreak?100:80,nominal);
 const extra=limitBreak?Math.max(0,nominal-100)*0.01:0;
 const multiplier=(qnHasLegendaryEffect(h,"critDamage")?10:5)*(1+extra);
 return {stat,chance,multiplier};
}
function qnHeroGainExp(amount){
 const h=s.hero;
 if(!h||s.chapter!==2)return 0;

 qnHeroNormalize(h);

 const gain=Math.max(0,Math.floor(Number(amount)||0));
 h.exp=Math.max(0,(Number(h.exp)||0)+gain);

 let leveled=0;

 while(h.level<50 && h.exp>=h.level*100){
  h.exp-=h.level*100;
  h.level++;
  leveled++;
 }

 if(leveled){
  const oldMax=h.maxHp;
  qnHeroNormalize(h);
  
  log("⭐ 레벨업! LV."+h.level+" 달성!");
 }

 if(h.level>=50)h.exp=0;

 save();
 return leveled;
}



/* QN_LEGENDARY_EFFECT_CHECK_V1 */
function qnHasLegendaryEffect(h,effectId){
 if(!h||!effectId)return false;

 const equipment=h.equipment||{};

 return ["weapon","armor","accessory"].some(slot=>{
  const item=equipment[slot];
  return item?.grade==="legendary"
   && item?.effect?.id===effectId
   ;
 });
}

/* QN_EQUIPMENT_STATS_V1 */
function qnHeroTotalStat(h,stat){
 const base=Number(h?.stats?.[stat])||0;
 const equipment=h?.equipment||{};
 let bonus=0;

 for(const slot of ["weapon","armor","accessory"]){
  const item=equipment[slot];
  if(item?.stat===stat){
   bonus+=Number(item.value)||0;
  }
 }

 return base+bonus;
}

function qnHeroSkillDamage(h,mult){
 qnHeroNormalize(h);

 const key=QN_GROWTH_SPECIAL[h.classId]||"atk";
 return Math.round((h.stats.atk*10+h.stats[key]*10)*mult);
}

function qnHeroRollDamage(h,baseDamage){
 const c=qnHeroCritical(h);
 const critical=Math.random()*100<c.chance;

 return {
  critical,
  damage:Math.round(
   baseDamage*(critical?c.multiplier:1)
  )
 };
}

/* QN_LEGENDARY_COMBAT_HELPERS_V1 */
function qnGearEffect(h,id){
 for(const slot of ["armor","accessory"]){
  const item=h?.equipment?.[slot];
  if(item?.grade==="legendary"&&item.effect?.id===id)
   return item.effect;
 }
 return null;
}
function qnCombatHits(h){
 return 1+Math.max(0,Math.min(10,
  Number(qnGearEffect(h,"combo")?.count)||0));
}
function qnCombatBarriers(h){
 return Math.max(0,Math.min(5,
  Number(qnGearEffect(h,"barrier")?.count)||0));
}
function qnCombatHas(h,id){
 return !!qnGearEffect(h,id);
}
/* QN_BATTLE_V2 */
const QN_BATTLE_SKILLS={
 warrior:"최후의 저항",
 ranger:"집중 사격",
 assassin:"급소 찌르기",
 mage:"생명 연소"
};



function qnBattleAttack(index){
 const h=s.hero,d=h?.surface,b=d?.battle;
 if(!b)return;
 qnHeroNormalize(h);
 if(!Number.isInteger(index)||index<0||index>3)return;
 if(index===1&&b.skillUsed)return;
 if(index===2&&(h.healCooldown||0)>0)return;

 const has=id=>qnCombatHas(h,id);
 const maxHp=()=>Math.max(1,h.maxHp);
 const heal=(amount,source="none")=>{
  const before=h.hp;
  h.hp=Math.min(maxHp(),h.hp+Math.ceil(amount));
  if(source!=="none" && amount>maxHp()-before && !h.overhealBarrier){
   h.overhealBarrier=1;
   h.overhealBarrierSource=source;
  }
  return h.hp-before;
 };
 const survive=()=>{
  if(h.hp>0)return true;
  if(has("undying")&&!b.undyingUsed){
   b.undyingUsed=true;h.hp=1;
   lines.push("✨ 불굴 발동! HP 1로 생존");
   return true;
  }
  return false;
 };
 const lines=[];

 const finishVictory=(reflected=false)=>{
  const floor=d.floor;
  const exp=30+floor*10;
  const gems=5+Math.floor(Math.random()*11);
  const drain=has("drain");
  const mage=h.classId==="mage";
  const mageSkillKill=mage&&!reflected&&index===1&&lastHitLanded;

  const rate=(drain?0.3:0)+(mage&&!mageSkillKill?0.3:0);
  if(rate>0){
   const source=drain?"armor":"innate";
   const gained=heal(b.maxHp*rate,source);
   if(gained)lines.push("💚 처치 흡혈 +"+gained);
  }

  if(!survive()){
   h.hp=0;
   delete d.battle;
   d.message=lines.join("\n")+"\n☠️ 사망";
   qnChapter2Death();
   return;
  }

  h.gems=(h.gems||0)+gems;
  delete d.battle;
  d.floor++;
  d.rooms=qnSurfaceRooms();

  if(index!==2&&(h.healCooldown||0)>0)h.healCooldown--;

  const leveled=qnHeroGainExp(exp);
  h.gearReward=[qnGenerateGear(floor),qnGenerateGear(floor)];

  lines.push(reflected?"🏆 반사로 몬스터 처치!":"🏆 몬스터 처치!");
  lines.push("⭐ 경험치 +"+exp);
  lines.push("💎 젬 +"+gems);
  if(leveled)lines.push("🎉 LV."+h.level+" 레벨 업!");

  d.message=lines.join("\n");
  save();
  qnRenderChapter2();
  qnExploreResultPopup(d.message);
 };

 const frenzy=has("frenzy")?2:1; let lastHitLanded=false;

 if(index===3){
  const cost=Math.ceil(Math.max(0,h.hp)*0.1);
  h.hp=Math.max(0,h.hp-cost);
  delete d.battle;
  if((h.healCooldown||0)>0)h.healCooldown--;
  d.message="🏃 도주 성공! HP -"+cost;
  save();qnRenderChapter2();return;
 }
 if(index===2){
  const gained=heal(maxHp()*0.3);
  h.healCooldown=3;
  lines.push("💚 체력 회복 +"+gained);
 }else{
  const skill=index===1;
  if(skill)b.skillUsed=true;
  let damage=0;
  if(h.classId==="warrior")damage=maxHp();
  else if(h.classId==="ranger")damage=qnHeroTotalStat(h,"agi")*10;
  else if(h.classId==="assassin")damage=qnHeroTotalStat(h,"crit")*5;
  else damage=qnHeroTotalStat(h,"atk")*10;

  if(skill){
   if(h.classId==="warrior")damage*=2;
   else if(h.classId==="ranger")damage*=1.8;
   else if(h.classId==="assassin")damage*=2.5;
   else{
    damage=qnHeroTotalStat(h,"atk")*100;
    h.hp-=Math.ceil(maxHp()*0.2);
   }
   if(has("skillBoost"))damage*=2;
  }

  const hits=qnCombatHits(h);
  for(let i=0;i<hits;i++){
   if(b.hp<=0)break; lastHitLanded=false;
   const dodge=Math.min(50,Math.max(0,Number(b.dodge)||0));
   if(Math.random()*100<dodge){
    lines.push("💨 "+(i+1)+"타 빗나감");
   }else{
    if((b.enemyBarrier||0)>0&&!has("pierce")){
    b.enemyBarrier--;
    lines.push("🛡️ 몬스터 베리어가 공격을 막았습니다!");
    if(!survive())break;
    continue;
   }
   lastHitLanded=true;
   const roll=qnHeroRollDamage(h,damage*frenzy);
    const dealt=Math.max(0,Math.round(roll.damage));
    b.hp=Math.max(0,b.hp-dealt);
    lines.push((roll.critical?"💥 치명타! ":"⚔️ ")+(i+1)+"타 "+dealt+" 피해");

    if(h.classId==="mage"&&skill){
     const gained=heal(b.maxHp*0.3,"innate");
     if(gained)lines.push("💚 생명 흡수 +"+gained);
    }
   }
   if(!survive())break;
  }
 }

 if(b.hp<=0){
  finishVictory(false);
  return;
 }

 if(!survive()){
  h.hp=0;delete d.battle;
  d.message=lines.join("\n")+"\n☠️ 사망";
  qnChapter2Death();return;
 }

 const enemyHits=Math.max(1,Number(b.hits)||1);
 if(b.barrierCharges===undefined)b.barrierCharges=qnCombatBarriers(h);

 for(let i=0;i<enemyHits;i++){
  if(b.hp<=0)break;
  const original=Math.max(1,Number(b.atk)||1);
  let taken=Math.max(1,original-Math.floor(qnHeroTotalStat(h,"def")/2));
  if(has("counter"))taken=Math.ceil(taken*0.1);
  taken=Math.ceil(taken*frenzy);

  if(h.overhealBarrier>0){
   h.overhealBarrier--;
   if(h.overhealBarrier<=0){
    h.overhealBarrier=0;
    h.overhealBarrierSource=null;
   }
   taken=0;
   lines.push("🛡️ 흡혈 베리어 방어!");
  }else if(b.barrierCharges>0){
   b.barrierCharges--;
   taken=0;
   lines.push("🛡️ 베리어 방어!");
  }

  if(taken>0){
   h.hp-=taken;
   lines.push("🩸 몬스터 공격 HP -"+taken);
  }
  if(has("counter")){
   const reflected=Math.ceil(original*0.7*frenzy);
   b.hp=Math.max(0,b.hp-reflected);
   lines.push("🛡️ 반사 "+reflected+" 피해!");
  }
  if(b.hp<=0)break;
  if(!survive())break;
 }

 if(b.hp<=0){
  finishVictory(true);
  return;
 }

 if(!survive()){
  h.hp=0;delete d.battle;
  d.message=lines.join("\n")+"\n☠️ 사망";
  qnChapter2Death();return;
 }
 if(index!==2&&(h.healCooldown||0)>0)h.healCooldown--;
 b.turn++;b.message=lines.join("\n");
 d.message=b.message;
 save();qnRenderChapter2();
}

function qnSurfaceChoose(index){
 const h=s.hero;
 if(!h || h.hp<=0){
  alert("☠️ 사망한 영웅은 탐험할 수 없습니다.\n새로운 직업을 선택해 다시 도전하세요.");
  return;
 }
 const d=h?.surface;
 if(!d||!d.rooms||index<0||index>=d.rooms.length)return;

 let type=d.rooms[index];
 if(type==="mystery"){

 }

 d.floor++;
 d.rooms=qnSurfaceRooms();

 qnRpgTab='explore';
 save();

}

};

const QN_GEAR_EFFECTS={
 warrior:{
  armor:["counter","반격"],
  accessory:["undying","불굴"]
 },
 ranger:{
  armor:["combo","연속 공격"],

 },
 assassin:{

 },
 mage:{
  armor:["drain","처치 시 체력 회복"],

 }
};


function qnGearRollValue(level){
 const lv=Math.max(1,Math.floor(Number(level)||1));
 return Math.max(1,Math.floor(lv*10*(0.7+Math.random()*0.6)));
}
function qnWeightedRoll(entries){
 const total=entries.reduce((n,x)=>n+x[1],0);
 let r=Math.random()*total;
 for(const [value,weight] of entries){
  r-=weight;
  if(r<0)return value;
 }
 return entries[entries.length-1][0];
}
function qnGenerateGear(floor){
 const h=s.hero;
 const slot=QN_GEAR_SLOTS[Math.floor(Math.random()*QN_GEAR_SLOTS.length)];
 const grade=Math.random()<0.30?"legendary":"common";
 const names=QN_GEAR_NAMES[slot];
 const name=names[Math.floor(Math.random()*names.length)];
 const stat=QN_GROWTH_SPECIAL[h?.classId]||"atk";
 const base=qnGearRollValue(h?.level||1);
 const value=grade==="legendary"&&slot==="weapon"
  ?Math.floor(base*1.5):base;

 const armorEffects=[
  ["combo","연속 공격"],
  ["critDamage","치명타 피해"],
  ["counter","반사·반격"],
  ["drain","흡혈"]
 ];
 const accessoryEffects=[
  ["undying","불굴"],
  ["pierce","관통"],
  ["frenzy","광란"],
  ["skillBoost","스킬 부스트"],
  ["limitBreak","한계 돌파"],
  ["barrier","베리어"]
 ];

 let effect=null;
 if(grade==="legendary"&&slot!=="weapon"){
  let chosen;
  if(slot==="armor"){
   const own={warrior:"counter",ranger:"combo",assassin:"critDamage",mage:"drain"}[h?.classId];
   const weights=armorEffects.map(x=>[x,x[0]===own?20:80/3]);
   chosen=qnWeightedRoll(weights);
  }else{
   chosen=accessoryEffects[Math.floor(Math.random()*accessoryEffects.length)];
  }
  effect={id:chosen[0],name:chosen[1]};
  if(effect.id==="combo"){
   effect.count=qnWeightedRoll([
    [1,30],[2,22],[3,16],[4,11],[5,8],
    [6,5],[7,3.5],[8,2],[9,1.5],[10,1]
   ]);
   effect.name+=" +"+effect.count;
  }
  if(effect.id==="barrier"){
   effect.count=qnWeightedRoll([
    [1,40],[2,30],[3,15],[4,10],[5,5]
   ]);
   effect.name+=" +"+effect.count;
  }
 }

 const statNames={atk:"공격력",def:"방어력",agi:"민첩성",crit:"치명타"};
 return {
  slot,grade,
  name:(grade==="legendary"?"전설의 ":"")+name,
  stat,value,
  statText:statNames[stat]+" +"+value,
  effect,
  effectText:effect?"✨ "+effect.name:"",
  floor:Math.max(1,Math.floor(Number(floor)||1))
 };
}
function qnChooseGearReward(index){
 const h=s.hero;
 if(!Array.isArray(h?.gearReward)||h.gearReward.length!==2)return;
 if(![-1,0,1].includes(index))return;

 if(index>=0){
  const item=h.gearReward[index];
  if(!["weapon","armor","accessory"].includes(item?.slot))return;
  if(!h.equipment||typeof h.equipment!=="object"){
   h.equipment={};
  }
  const previousArmor=h.equipment.armor;
   const removingDrain=item.slot==="armor"
    && previousArmor?.effect?.id==="drain"
    && item.effect?.id!=="drain";
   h.equipment[item.slot]=item;
   qnHeroNormalize(h);
   if(removingDrain && h.overhealBarrierSource==="armor"){
   h.overhealBarrier=0;
   h.overhealBarrierSource=null;
  }

 }

 delete h.gearReward;
 save();
 qnRenderChapter2();
}

function qnEcoRollRooms(){const pool=[["monster",60],["trap",15],["shop",5],["rest",5],["mystery",10],["treasure",5]];return Array.from({length:3},()=>{let r=Math.random()*100;for(const [id,w] of pool){r-=w;if(r<0)return id}return "monster"})}

function qnEcoApply(b,code){const [id,x]=code.split(":"),n=Number(x);
 if(id==="atk")b.atk=Math.ceil(b.atk*(1+n/100));
 if(id==="reduce")b.reduce=Math.min(80,(b.reduce||0)+n);
 if(id==="dodge")b.dodge=Math.min(50,(b.dodge||0)+n);
 if(id==="hits")b.hits=Math.max(b.hits||1,n);
 if(id==="barrier")b.enemyBarrier=(b.enemyBarrier||0)+n;
 if(id==="drain")b.drain=(b.drain||0)+n;
 if(id==="regen")b.regen=(b.regen||0)+n;
 if(id==="poison")b.poison=true;
 if(id==="weakenheal")b.weakenheal=Math.max(b.weakenheal||0,n);
 if(id==="reflect")b.reflect=(b.reflect||0)+n;
}
function qnEcoTraits(b,base,f){qnEcoApply(b,base.effect);
 if(b.elite){const p=["reflect:20","dodge:20","hits:2","poison:1","regen:5","barrier:2","drain:10","reduce:20"];qnEcoApply(b,p[Math.floor(Math.random()*p.length)])}
 if(b.boss){const count=f<=20?1:f<=60?2:3,p=["reflect:20","dodge:25","hits:2","poison:1","regen:5","drain:15","reduce:25","weakenheal:30","atk:30"];
  for(let i=0;i<count;i++)qnEcoApply(b,p[(f*7+i*4)%p.length])}
}
function qnEcoPoison(h,lines){const arr=Array.isArray(h.statusEffects)?h.statusEffects:[],p=arr.find(x=>x.id==="poison");if(!p)return;

qnBattleScreen=function(){const h=s.hero,b=h.surface?.battle;if(!b)return "";
 const skill=QN_BATTLE_SKILLS[h.classId]||"고유 스킬",cd=h.healCooldown||0;
 const traits=[b.boss?"👑 보스":b.elite?"⚠️ 정예":"일반",b.enemyBarrier?"🛡️ "+b.enemyBarrier:"",b.poison?"☠️ 독":"",b.regen?"🌿 재생":"",b.reflect?"🪞 반사":"",b.hits>1?"⚔️ "+b.hits+"연타":""].filter(Boolean).join(" · ");

 '<button onclick="qnBattleAttack(3)">🏃 도주</button></div></div>'};
qnBattleAttack=function(index){const h=s.hero,d=h?.surface,b=d?.battle;if(!b||![0,1,2,3].includes(index))return;qnHeroNormalize(h);
 if(index===1&&b.skillUsed)return;if(index===2&&(h.healCooldown||0)>0)return;
 const has=id=>qnCombatHas(h,id),lines=[];
 const survive=()=>{if(h.hp>0)return true;if(has("undying")&&!b.undyingUsed){b.undyingUsed=true;h.hp=1;lines.push("✨ 불굴 · HP 1 생존");return true}return false};
 const heal=(amount,source)=>{const before=h.hp,raw=Math.ceil(Math.max(0,amount));h.hp=Math.min(h.maxHp,h.hp+raw);if(source&&raw>h.maxHp-before&&!h.overhealBarrier){h.overhealBarrier=1;h.overhealBarrierSource=source}return h.hp-before};
 const shield=()=>{if(h.overhealBarrier>0){h.overhealBarrier--;if(!h.overhealBarrier)h.overhealBarrierSource=null;return true}if(b.barrierCharges>0){b.barrierCharges--;return true}return false};
 const die=()=>{h.hp=0;d.message=lines.join("\n");qnChapter2Death()};
 const win=(counterKill=false,mageSkillKill=false)=>{
  if(!survive()){die();return}
  const f=d.floor,m=b.boss?5:b.elite?2:1,exp=(30+f*10)*m,gems=(5+Math.floor(Math.random()*11))*m;
  const rate=(has("drain")?.3:0)+(h.classId==="mage"&&!mageSkillKill?.3:0);
  if(rate){const n=heal(b.maxHp*rate,has("drain")?"armor":"innate");if(n)lines.push("💚 처치 흡혈 +"+n)}
  h.gems=(h.gems||0)+gems;
  if(b.boss){if(d.floor>=100){d.completed=true;d.rooms=[]}else{d.floor++;d.step=0;d.rooms=qnEcoRollRooms()}}else qnEcoAdvance(d);
  delete d.battle;if(index!==2&&h.healCooldown>0)h.healCooldown--;
  const level=qnHeroGainExp(exp);h.gearReward=qnEcoGear(f,b);
  lines.push("🏆 "+(b.boss?"보스":b.elite?"정예":"몬스터")+" 처치 · EXP +"+exp+" · 💎 +"+gems);
  if(level)lines.push("🎉 레벨 업! LV."+h.level);
  if(d.completed)lines.push("👑 100층 정복 · 챕터 3 준비 중");
  d.message=lines.join("\n");save();qnRenderChapter2();qnExploreResultPopup(d.message)};
 const frenzy=has("frenzy")?2:1;
 if(index===3){const cost=Math.ceil(h.hp*.1);h.hp=Math.max(0,h.hp-cost);delete d.battle;qnEcoAdvance(d);if(h.healCooldown>0)h.healCooldown--;d.message="🏃 도주 성공 · HP -"+cost+" · 방 선택 "+d.step+"/30";save();qnRenderChapter2();return}
 if(index===2){const n=heal(h.maxHp*.3*(1-(b.weakenheal||0)/100));h.healCooldown=3;lines.push("💚 회복 +"+n)}
 else{
  const skill=index===1;if(skill)b.skillUsed=true;
  let damage=h.classId==="warrior"?h.maxHp:h.classId==="ranger"?qnHeroTotalStat(h,"agi")*10:h.classId==="assassin"?qnHeroTotalStat(h,"crit")*5:qnHeroTotalStat(h,"atk")*10;
  if(skill){if(h.classId==="warrior")damage*=2;else if(h.classId==="ranger")damage*=1.8;else if(h.classId==="assassin")damage*=2.5;else{damage=qnHeroTotalStat(h,"atk")*100;h.hp-=Math.ceil(h.maxHp*.2)}if(has("skillBoost"))damage*=2}
  for(let i=0,hits=qnCombatHits(h);i<hits&&b.hp>0;i++){
   if(Math.random()*100<(b.dodge||0)){lines.push("💨 "+(i+1)+"타 회피");continue}
   if(b.enemyBarrier>0&&!has("pierce")){b.enemyBarrier--;lines.push("🛡️ 적 베리어 -1");continue}
   const roll=qnHeroRollDamage(h,damage*frenzy),dealt=Math.max(0,Math.min(b.hp,Math.round(roll.damage*(1-(b.reduce||0)/100))));
   b.hp-=dealt;lines.push((roll.critical?"💥 치명타 ":"⚔️ ")+(i+1)+"타 "+dealt+" 피해");
   if(h.classId==="mage"&&skill){const n=heal(b.maxHp*.3,"innate");if(n)lines.push("💚 생명 흡수 +"+n)}
   if(b.reflect&&dealt){const n=Math.ceil(dealt*b.reflect/100);if(shield())lines.push("🛡️ 반사 피해 방어");else{h.hp-=n;lines.push("🪞 반사 피해 -"+n)}}
   if(!survive()){die();return}
  }
 }
 if(b.hp<=0){win(false,index===1&&h.classId==="mage");return}
 if(!survive()){die();return}
 const bossHeal=b.boss&&b.turn%3===0,hits=bossHeal?0:Math.max(1,b.hits||1);
 for(let i=0;i<hits;i++){

   if(b.drain){b.hp=Math.min(b.maxHp,b.hp+Math.ceil(taken*b.drain/100));lines.push("🩸 몬스터 흡혈")}
   if(b.poison)qnEcoInflict(h)}
  if(has("counter")){const n=Math.ceil(original*.7*frenzy);b.hp=Math.max(0,b.hp-n);lines.push("🛡️ 반격 "+n)}
  if(!survive()){die();return}if(b.hp<=0)break;
 }
 if(b.hp<=0){win(true,false);return}
 if(bossHeal){const n=Math.min(b.maxHp-b.hp,Math.ceil(b.maxHp*.1));b.hp+=n;lines.push("👑 보스 치유 +"+n)}
 if(b.regen){const n=Math.min(b.maxHp-b.hp,Math.ceil(b.maxHp*b.regen/100));b.hp+=n;lines.push("🌿 몬스터 재생 +"+n)}

 if(index!==2&&h.healCooldown>0)h.healCooldown--;
 b.turn++;b.message=lines.join("\n");d.message=b.message;save();qnRenderChapter2()
};

 '<div style="text-align:center;font-size:13px">💎 보유 젬 <b>'+(h.gems||0)+'</b> · '+d.floor+'/100F · '+(d.step||0)+'/30</div>'+
 '<div class="qn2-box" style="padding:8px;font-size:12px">현재 무기: <b>'+(current?.name||"없음")+'</b><div>'+(current?stat(current):"무기를 장착하지 않았습니다")+'</div></div>'+
 '<div style="display:grid;gap:7px">'+shop.offers.map((offer,i)=>{
  const g=offer.item,old=current?.stat===g.stat?(current?.value||0):0,diff=g.value-old;
  const canBuy=!shop.purchased&&(h.gems||0)>=offer.price;
  return '<div class="qn2-box" style="padding:9px;margin:0"><b>'+(g.grade==="legendary"?"🟡 전설":"⚪ 일반")+' · '+g.name+'</b>'+
  '<div style="font-size:12px;margin:5px 0">'+stat(g)+' · '+(current?.stat===g.stat?"현재 무기 대비 "+(diff>=0?"+":"")+diff:"다른 능력치")+'</div>'+
  '<button style="width:100%;min-height:40px" onclick="qnShopBuy('+i+')" '+(canBuy?"":"disabled")+'>'+
  (shop.purchased?"구매 완료":(h.gems||0)<offer.price?"💎 "+offer.price+" · 젬 부족":"💎 "+offer.price+" · 구매하고 교체")+'</button></div>';
 }).join('')+'</div>'+
 '<button style="width:100%;margin-top:10px;min-height:44px" onclick="qnShopLeave()">🚪 상점 나가기 · 다음 방으로</button>'+
 '<div style="font-size:11px;opacity:.8;text-align:center;margin-top:8px">무기는 한 개만 장착합니다. 구매하면 기존 무기는 사라집니다. 상점당 구매 1회.</div></div>';
}
function qnShopBuy(i){
 const h=s.hero,d=h?.surface,shop=d?.shop;
 if(!shop||shop.purchased||!Number.isInteger(i)||i<0||i>=shop.offers.length)return;
 const offer=shop.offers[i];if((h.gems||0)<offer.price)return;
 h.gems-=offer.price;h.equipment=h.equipment||{};
 h.equipment.weapon=offer.item;
 qnHeroNormalize(h);shop.purchased=true;
 d.message="🏪 "+offer.item.name+" 구매 · 💎 -"+offer.price;
 save();qnRenderChapter2();
}
function qnShopLeave(){
 const d=s.hero?.surface;if(!d?.shop)return;
 const purchased=d.shop.purchased;
 delete d.shop;qnEcoAdvance(d);
 d.message=purchased?"🏪 무기를 교체하고 상점을 떠났다.":"🏪 상점을 둘러보고 떠났다.";
 save();qnRenderChapter2();
}
const qnShopPreviousChoose=qnSurfaceChoose;
qnSurfaceChoose=function(i){
 const d=s.hero?.surface;
 if(d&&!d.shop&&!d.battle&&!s.hero.gearReward?.length&&d.rooms?.[i]==="shop"){
  qnShopOpen();return;
 }
 return qnShopPreviousChoose(i);
};
const qnShopPreviousExplore=qnRpgExploreScreen;
qnRpgExploreScreen=function(){
 if(s.hero?.surface?.shop)return qnShopScreen();
 return qnShopPreviousExplore();
};
if(s.chapter===2&&s.hero)qnRenderChapter2();

/* QN_TRAPS_V1 */
const qnTrapPreviousChoose=qnSurfaceChoose;
qnSurfaceChoose=function(i){
 const h=s.hero,d=h?.surface;
 if(!h||h.hp<=0||h.qnDead||!d||d.battle||d.shop||d.completed||h.gearReward?.length||!Number.isInteger(i)||i<0||i>=d.rooms.length)return;
 if(d.rooms[i]!=="trap")return qnTrapPreviousChoose(i);
 const roll=Math.random(),old=h.hp;
 if(roll<.4){
  const damage=Math.ceil(h.maxHp*.10);
  h.hp=Math.max(1,h.hp-damage);
  qnEcoAdvance(d);
  d.message="🩸 가시 함정 · HP -"+(old-h.hp)+" · 방 선택 "+d.step+"/30";
  save();qnRenderChapter2();qnExploreResultPopup(d.message);return;
 }
 if(roll<.7){
  qnEcoInflict(h);
  qnEcoAdvance(d);
  d.message="☠️ 독성 포자 · 독 3턴 · 방 선택 "+d.step+"/30";
  save();qnRenderChapter2();qnExploreResultPopup(d.message);return;
 }
 qnBattleStart(false);
 if(!d.battle)return;
 const b=d.battle;
 b.ambush=true;
 b.message="🕷️ 매복 함정! 몬스터가 먼저 공격했다.";
 const original=Math.max(1,Math.ceil(b.atk)),hits=Math.max(1,b.hits||1);
 let log=[b.message];
 for(let n=0;n<hits;n++){
  const dodge=Math.min(50,Math.max(0,qnHeroTotalStat(h,"agi")/10));
  if(Math.random()*100<dodge){log.push("💨 "+(n+1)+"타 회피");continue}
  if(h.overhealBarrier>0){h.overhealBarrier--;if(!h.overhealBarrier)h.overhealBarrierSource=null;log.push("🛡️ 초과 회복 베리어 방어");continue}
  if(b.barrierCharges>0){b.barrierCharges--;log.push("🛡️ 베리어 방어");continue}
  let dmg=Math.max(1,original-Math.floor(qnHeroTotalStat(h,"def")/2));
  if(qnCombatHas(h,"counter"))dmg=Math.ceil(dmg*.1);
  if(qnCombatHas(h,"frenzy"))dmg*=2;
  h.hp=Math.max(0,h.hp-dmg);log.push("🩸 기습 피해 -"+dmg);
  if(b.drain){const actual=Math.min(old,dmg);b.hp=Math.min(b.maxHp,b.hp+Math.ceil(actual*b.drain/100))}
  if(b.poison)qnEcoInflict(h);
  if(qnCombatHas(h,"counter")){const reflected=Math.ceil(original*.7);b.hp=Math.max(0,b.hp-reflected);log.push("🛡️ 반격 "+reflected)}
  if(h.hp<=0){if(qnCombatHas(h,"undying")){h.hp=1;b.undyingUsed=true;log.push("✨ 불굴 · HP 1 생존")}else break}
  if(b.hp<=0)break;
 }
 b.turn=2;
 b.message=log.join("\n");d.message=b.message;
 if(h.hp<=0){qnChapter2Death();return}
 if(b.hp<=0){b.hp=1;b.message+="\n⚠️ 기습 반격으로 쓰러지기 직전이다."}
 save();qnRpgTab="explore";qnRenderChapter2();
};
